repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v5.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
          - id: check-toml
          - id: check-merge-conflict

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.7
      hooks:
          - id: ruff-check
            args: [--fix]
          - id: ruff-format

    - repo: local
      hooks:
          - id: ty
            name: ty check
            entry: uv run ty check --exclude "tests/"
            language: system
            types_or: [python, pyi]
            pass_filenames: false

          - id: pytest
            name: pytest (pre-push)
            entry: uv run pytest
            language: system
            types_or: [python, pyi]
            pass_filenames: false
            stages: [pre-push]
